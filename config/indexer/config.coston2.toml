# C-chain indexer for the extension proxy.
#
# The proxy needs the FSP data — signing policies, voter registrations, recent
# voting rounds — to verify what Flare's data providers send it. Flare issues
# credentials to a hosted indexer on request; this config runs our own instead,
# so the deployment has no dependency on someone else's database.

[indexer]
mode = "fsp"

# 0 is the recommended provider setting and is what we want. It is NOT the cause of a
# stale signing policy — that is initial_signing_policy_offset, see the proxy config.
# For retention 0 and 1 are identical (the indexer does `if historyEpochs == 0 {
# historyEpochs = 1 }`), and the FSP metadata anchor is C-2 either way; 1 only makes the
# full-block backfill far larger, which is a cold start of hours for no gain.
history_epochs = 0

# 20, not more. At 40 the block catch-up went silent — no CPU, no network, no rows —
# while the FSP event backfill still completed in seconds. Whatever the cause, this is
# the value that demonstrably indexes.
rpc_concurrency = 20
batch_size = 1000
# Must match the endpoint's eth_getLogs cap: a wider range is rejected outright and
# the indexer retries it silently, so the backfill never advances. Flare's own public
# RPC caps this at 30. That makes the initial FSP backfill slow, but block catch-up —
# which is what dominates once the backfill is done — is far faster here than against
# a rate-limited third party, where it simply stalls.
log_range = 1000
new_block_check_millis = 1000
confirmations = 1

[logger]
level = "INFO"
console = true

[chain]
# Only the indexer uses this endpoint; the enclave's own reads stay on Flare's RPC.
node_url = "https://rpc.ankr.com/flare_coston2"
chain_type = 1            # Avalanche-based

[db]
host = "indexer-db"
port = 3306
database = "flare_ftso_indexer"
username = "indexer"
password = "indexer"
log_queries = false

# FSP mode hardcodes collectors for Submission and Relay, but NOT for
# FlareSystemsManager.signNewSigningPolicy — and that is the exact transaction the
# proxy's collectSignatures reads to build each new signing policy at reward-epoch
# rollover. Without it the proxy can never advance past the epoch it booted on, no
# matter what initial_signing_policy_offset says. Extra entries are merged with the
# FSP defaults, so this is purely additive.
[[indexer.collect_transactions]]
contract_name = "FlareSystemsManager"
func_sig = "6b4c7bd6"   # signNewSigningPolicy(uint24,bytes32,(uint8,bytes32,bytes32))
status = true
