# C-chain indexer for the extension proxy.
#
# The proxy needs the FSP data — signing policies, voter registrations, recent
# voting rounds — to verify what Flare's data providers send it. Flare issues
# credentials to a hosted indexer on request; this config runs our own instead,
# so the deployment has no dependency on someone else's database.

[indexer]
mode = "fsp"

# NOT 0. With 0 the indexer keeps only ~15 minutes of blocks, and history drop then
# deletes the signing-policy events of each new reward epoch before the proxy has
# read them: the proxy stays pinned to the epoch it started on while the chain moves
# on, and the FTDC availability check never resolves — nobody verifies a machine
# whose proxy sits on a stale policy. Two epochs is what the proxy's
# initial_signing_policy_offset = 2 actually needs.
history_epochs = 2

rpc_concurrency = 20      # a shared third-party endpoint: back off before it does
batch_size = 1000
log_range = 1000          # must match the endpoint's eth_getLogs cap: a wider range is
                          # rejected outright and the indexer retries it silently, so the
                          # backfill simply never advances. Flare's own public RPC caps
                          # this at 30 blocks, which makes a cold start take hours.
new_block_check_millis = 1000
confirmations = 1

[logger]
level = "INFO"
console = true

[chain]
# Only the indexer uses this endpoint; the enclave's own reads stay on Flare's RPC.
node_url = "https://rpc.ankr.com/flare_coston2"
chain_type = 1            # Avalanche-based

[db]
host = "indexer-db"
port = 3306
database = "flare_ftso_indexer"
username = "indexer"
password = "indexer"
log_queries = false
