<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agama · dApp</title>
<style>
  :root{
    --bg:#0B1310; --panel:#111E18; --panel-2:#0D1712;
    --ink:#E9F1EA; --soft:#9DB0A6; --faint:#6E8077;
    --line:#22332B; --brand:#59A882; --brand-deep:#254839;
    --accent:#E6B450; --up:#5FBE8E; --down:#E0895E;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);
    background:radial-gradient(900px 400px at 50% -160px,rgba(89,168,130,.12),transparent 70%),var(--bg);
    min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
  .shell{max-width:560px;margin:0 auto;padding:26px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-deep);font-size:17px}
  .brand span{color:var(--faint);font-size:12px;font-weight:500}
  button{font-family:var(--sans);cursor:pointer;border:none;border-radius:10px;font-weight:600;transition:opacity .15s}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-wallet{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 14px;font-size:13px;font-variant-numeric:tabular-nums}
  .netsel{background:var(--panel);border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:8px 10px;font-size:12px;font-family:var(--sans)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;
    box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 40px rgba(0,0,0,.35)}
  h1{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em;margin:0 0 4px}
  .sub{color:var(--soft);font-size:14px;margin:0 0 22px}
  label{display:block;font-size:12px;color:var(--soft);margin-bottom:8px;font-weight:500}
  .inrow{display:flex;gap:10px;align-items:stretch}
  input[type=number]{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:13px 14px;font-size:18px;font-variant-numeric:tabular-nums;font-family:var(--sans);outline:none;width:100%}
  input[type=number]:focus{border-color:var(--brand)}
  .unit{display:flex;align-items:center;padding:0 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--soft);font-size:13px;font-weight:600}
  .quote{margin:20px 0;padding:18px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
  .bigrate{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
  .bigrate small{font-family:var(--sans);font-size:15px;color:var(--soft);font-weight:600;margin-left:4px}
  .qrow{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-top:12px}
  .qrow b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
  .btn-primary{width:100%;background:var(--brand);color:#08130D;padding:15px;font-size:15px;margin-top:6px}
  .btn-ghost{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:12px;font-size:13px;margin-top:10px}
  .pos{display:flex;justify-content:space-between;align-items:center;font-size:14px}
  .pos .v{font-variant-numeric:tabular-nums;font-weight:600}
  .muted{color:var(--faint);font-size:12px}
  .status{font-size:12.5px;color:var(--soft);margin-top:14px;min-height:18px;word-break:break-word}
  .status.err{color:var(--down)} .status.ok{color:var(--up)}
  a{color:var(--brand)}
  .divider{height:1px;background:var(--line);margin:18px 0}
  .pill{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
  .hide{display:none}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><div class="mark">A</div><div>Agama <span>· fixed-rate XRP</span></div></div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="net" class="netsel">
        <option value="coston2">Coston2</option>
        <option value="coston2demo">Coston2 · 10-min demo</option>
        <option value="local">Local (anvil)</option>
      </select>
      <button id="connect" class="btn-wallet">Connect</button>
    </div>
  </header>

  <div class="card">
    <h1>Lock a fixed rate</h1>
    <p class="sub">Deposit demo FXRP, buy the principal token at a discount, lock your rate. Redeem 1:1 at maturity.</p>

    <label>You deposit</label>
    <div class="inrow">
      <input id="amt" type="number" min="0" step="10" value="500" placeholder="0">
      <div class="unit">FXRP</div>
    </div>

    <div class="quote">
      <div><span class="bigrate"><span id="apr">–</span><small>% APR fixed</small></span></div>
      <div class="qrow"><span>PT you receive</span><b><span id="ptout">–</span> PT</b></div>
      <div class="qrow"><span>Locked profit at maturity</span><b style="color:var(--up)"><span id="profit">–</span> FXRP</b></div>
    </div>

    <button id="lock" class="btn-primary" disabled>Connect wallet to lock</button>
    <button id="mint" class="btn-ghost hide">Mint 1,000 demo FXRP</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card" id="poscard">
    <div class="pos"><span class="muted">Your FXRP</span><span class="v"><span id="balF">–</span> FXRP</span></div>
    <div class="divider"></div>
    <div class="pos"><span class="muted">Your PT (certainty)</span><span class="v"><span id="balP">–</span> PT</span></div>
    <div class="divider"></div>
    <div class="pos">
      <div><span class="muted">Maturity</span><div id="matWhen" class="muted" style="margin-top:2px"></div></div>
      <button id="redeem" class="btn-wallet" disabled>Redeem PT</button>
    </div>
  </div>

  <div style="text-align:center"><span class="pill" id="chainpill">not connected</span></div>
</div>

<script type="module">
import { createPublicClient, createWalletClient, custom, http, parseUnits, formatUnits }
  from 'https://esm.sh/viem@2';

// ---- deployed addresses (local = deterministic anvil; coston2 filled after deploy) ----
const CONFIG = {
  local: {
    chainId: 31337, name:'Anvil', rpc:'http://localhost:8546',
    symbol:'ETH',
    anchor:'0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9',
    fxrp:'0x5FbDB2315678afecb367f032d93F642f64180aa3',
    pt:'0x75537828f2ce51be7289709686A69CbFDbB714F1',
  },
  coston2: {
    chainId: 114, name:'Coston2', rpc:'https://coston2-api.flare.network/ext/C/rpc',
    symbol:'C2FLR',
    anchor:'0xC0E346206B5d6446f69522D29A88BC45B2B5c719',
    fxrp:'0xA6fC08A750dC00e6f613e2aabaB5a54949D8B356',
    pt:'0x4557491bCd8Da8BD2e32861b5C3CB70EDCB3D1aE',
  },
  coston2demo: { // short maturity (~10 min) so the full lock -> redeem cycle is demoable live
    chainId: 114, name:'Coston2', rpc:'https://coston2-api.flare.network/ext/C/rpc',
    symbol:'C2FLR',
    anchor:'0xd84508307C035F409777e2b5E5eCa90bE34Eb292',
    fxrp:'0x8E55FD325B39eC271f9bd49a2A3cc99b87990212',
    pt:'0x58A3A1B185ecBFe9730AC36Ec6a0ce454D9EE9D8',
  },
};

const ANCHOR_ABI = [
  {type:'function',name:'previewLock',stateMutability:'view',inputs:[{type:'uint256'}],outputs:[{type:'uint256'},{type:'uint256'}]},
  {type:'function',name:'lockFixedRate',stateMutability:'nonpayable',inputs:[{type:'uint256'},{type:'uint256'}],outputs:[{type:'uint256'}]},
  {type:'function',name:'redeem',stateMutability:'nonpayable',inputs:[{type:'uint256'}],outputs:[{type:'uint256'}]},
  {type:'function',name:'maturity',stateMutability:'view',inputs:[],outputs:[{type:'uint256'}]},
];
const ERC20_ABI = [
  {type:'function',name:'mint',stateMutability:'nonpayable',inputs:[{type:'address'},{type:'uint256'}],outputs:[]},
  {type:'function',name:'approve',stateMutability:'nonpayable',inputs:[{type:'address'},{type:'uint256'}],outputs:[{type:'bool'}]},
  {type:'function',name:'balanceOf',stateMutability:'view',inputs:[{type:'address'}],outputs:[{type:'uint256'}]},
  {type:'function',name:'allowance',stateMutability:'view',inputs:[{type:'address'},{type:'address'}],outputs:[{type:'uint256'}]},
  {type:'function',name:'decimals',stateMutability:'view',inputs:[],outputs:[{type:'uint8'}]},
];
const MAX = (2n**256n)-1n;
const DEC = 6; // FXRP / PT decimals

let net = 'coston2', cfg = CONFIG.coston2, pub, wallet, account, maturity = 0n;
const $ = id => document.getElementById(id);
const fmt = (v,dp=2) => Number(formatUnits(v, DEC)).toLocaleString('en-US',{maximumFractionDigits:dp});
function setStatus(msg, kind=''){ const s=$('status'); s.textContent=msg; s.className='status '+kind; }

function makePublic(){ pub = createPublicClient({ transport: http(cfg.rpc) }); }

async function refreshQuote(){
  const raw = $('amt').value; const n = Number(raw);
  if(!pub || cfg.anchor.startsWith('0x0000') ){ $('apr').textContent='–'; return; }
  if(!(n>0)){ $('apr').textContent='–'; $('ptout').textContent='–'; $('profit').textContent='–'; return; }
  try{
    const amt = parseUnits(raw, DEC);
    const [ptOut, aprE18] = await pub.readContract({address:cfg.anchor, abi:ANCHOR_ABI, functionName:'previewLock', args:[amt]});
    $('apr').textContent = (Number(formatUnits(aprE18,18))*100).toFixed(2);
    $('ptout').textContent = fmt(ptOut, 2);
    const profit = ptOut - amt;
    $('profit').textContent = (profit>0n?'+':'') + fmt(profit, 2);
  }catch(e){ $('apr').textContent='–'; setStatus('Quote failed: '+(e.shortMessage||e.message), 'err'); }
}

async function refreshBalances(){
  if(!account || cfg.fxrp.startsWith('0x0000')) return;
  try{
    const [bf, bp] = await Promise.all([
      pub.readContract({address:cfg.fxrp, abi:ERC20_ABI, functionName:'balanceOf', args:[account]}),
      pub.readContract({address:cfg.pt, abi:ERC20_ABI, functionName:'balanceOf', args:[account]}),
    ]);
    $('balF').textContent = fmt(bf); $('balP').textContent = fmt(bp);
    const matured = maturity>0n && BigInt(Math.floor(Date.now()/1000)) >= maturity;
    $('redeem').disabled = !(bp>0n && matured);
    $('redeem').textContent = matured ? 'Redeem PT' : 'Locked till maturity';
  }catch(e){ /* ignore */ }
}

async function connect(){
  if(!window.ethereum){ setStatus('No wallet found. Install MetaMask (or use a burner on localhost).','err'); return; }
  try{
    const chain = { id:cfg.chainId, name:cfg.name, nativeCurrency:{name:cfg.name,symbol:cfg.symbol,decimals:18},
      rpcUrls:{default:{http:[cfg.rpc]}} };
    wallet = createWalletClient({ chain, transport: custom(window.ethereum) });
    [account] = await wallet.requestAddresses();
    try{ await wallet.switchChain({ id: cfg.chainId }); }
    catch(_){ try{ await wallet.addChain({ chain }); }catch(__){} }
    // route reads through the wallet provider too (avoids public-RPC CORS in the browser)
    pub = createPublicClient({ chain, transport: custom(window.ethereum) });
    $('connect').textContent = account.slice(0,6)+'…'+account.slice(-4);
    $('chainpill').textContent = cfg.name+' · connected';
    $('mint').classList.remove('hide');
    $('lock').disabled = false; $('lock').textContent = 'Lock fixed rate';
    try{ maturity = await pub.readContract({address:cfg.anchor, abi:ANCHOR_ABI, functionName:'maturity'});
      const d=new Date(Number(maturity)*1000); $('matWhen').textContent = d.toLocaleDateString(); }catch(_){}
    setStatus('');
    refreshBalances();
  }catch(e){ setStatus('Connect failed: '+(e.shortMessage||e.message),'err'); }
}

async function tx(run, pending, done){
  try{ setStatus(pending); const hash = await run();
    setStatus('Sent '+hash.slice(0,10)+'… waiting');
    await pub.waitForTransactionReceipt({ hash });
    setStatus(done,'ok'); refreshBalances(); refreshQuote();
  }catch(e){ setStatus((e.shortMessage||e.message),'err'); }
}

async function ensureAllowance(token, spender, amount){
  const a = await pub.readContract({address:token, abi:ERC20_ABI, functionName:'allowance', args:[account, spender]});
  if(a >= amount) return;
  const hash = await wallet.writeContract({account, address:token, abi:ERC20_ABI, functionName:'approve', args:[spender, MAX]});
  await pub.waitForTransactionReceipt({ hash });
}

$('mint').onclick = () => tx(
  () => wallet.writeContract({account, address:cfg.fxrp, abi:ERC20_ABI, functionName:'mint', args:[account, parseUnits('1000', DEC)]}),
  'Minting 1,000 demo FXRP…', 'Minted 1,000 FXRP ✓');

$('lock').onclick = async () => {
  const amt = parseUnits($('amt').value||'0', DEC);
  if(!(amt>0n)){ setStatus('Enter an amount','err'); return; }
  await tx(async () => {
    await ensureAllowance(cfg.fxrp, cfg.anchor, amt);
    return wallet.writeContract({account, address:cfg.anchor, abi:ANCHOR_ABI, functionName:'lockFixedRate', args:[amt, 0n]});
  }, 'Locking your rate…', 'Rate locked ✓ — you now hold PT');
};

$('redeem').onclick = async () => {
  const bp = await pub.readContract({address:cfg.pt, abi:ERC20_ABI, functionName:'balanceOf', args:[account]});
  if(!(bp>0n)){ setStatus('No PT to redeem','err'); return; }
  await tx(async () => {
    await ensureAllowance(cfg.pt, cfg.anchor, bp);
    return wallet.writeContract({account, address:cfg.anchor, abi:ANCHOR_ABI, functionName:'redeem', args:[bp]});
  }, 'Redeeming PT 1:1…', 'Redeemed ✓ — principal back in FXRP');
};

$('net').onchange = (e) => { net=e.target.value; cfg=CONFIG[net]; makePublic(); account=null;
  $('connect').textContent='Connect'; $('chainpill').textContent='not connected'; $('lock').disabled=true;
  $('lock').textContent='Connect wallet to lock'; $('mint').classList.add('hide');
  $('balF').textContent='–'; $('balP').textContent='–'; refreshQuote(); };
$('connect').onclick = connect;
$('amt').addEventListener('input', refreshQuote);

// live maturity countdown + periodic balance/redeem refresh
setInterval(() => {
  if(maturity>0n){
    const left = Number(maturity) - Math.floor(Date.now()/1000);
    if(left>0){ const m=Math.floor(left/60), s=left%60; $('matWhen').textContent = `redeemable in ${m}m ${String(s).padStart(2,'0')}s`; }
    else { $('matWhen').textContent = 'matured — redeemable now'; }
  }
}, 1000);
setInterval(() => { if(account) refreshBalances(); }, 10000);

makePublic(); refreshQuote();
</script>
</body>
</html>
