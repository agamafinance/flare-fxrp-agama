name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vv

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: python
        run: pip install -r requirements-dev.txt
      - working-directory: python
        run: python -m pytest -q
      # Replays the golden fixtures against a live extension process — no chain,
      # no TEE, no Docker. Catches wire-format drift against tee-node.
      #
      # Not --skip-setup: python/language.env runs the extension from
      # ./.venv/bin/python, and that venv is gitignored, so on a fresh checkout
      # only the setup step creates it. With --skip-setup this step failed in CI
      # while passing on any dev machine that already had the venv.
      - run: ./scripts/test-conformance.sh python

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - working-directory: tools
        run: go build ./...
      - working-directory: tools
        run: go vet ./...
      - working-directory: tools
        run: go test ./...
      - run: ./scripts/check-versions.sh
